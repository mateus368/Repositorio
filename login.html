<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger House</title>

<link rel="stylesheet" href="login.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-box">
        <h1>🍔 Burger House</h1>

        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">

        <button onclick="entrar()">Entrar</button>

        <p id="mensagem"></p>
    </div>
</div>

<!-- HOME -->
<div id="home">

<header>
    <div class="logo">🍔 Burger House</div>
    <button class="sair" onclick="sair()">Sair</button>
</header>

<section class="banner">
    <div>
        <h1>Os Melhores Hambúrgueres!</h1>
        <p>Feitos com ingredientes frescos e muito sabor.</p>
    </div>
</section>

<section class="cardapio">
    <h2>Nosso Cardápio</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
            <h3>X-Burger</h3>
            <p>R$ 24,90</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=500">
            <h3>X-Bacon</h3>
            <p>R$ 29,90</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=500">
            <h3>Combo Especial</h3>
            <p>R$ 39,90</p>
        </div>

    </div>
</section>

</div>

<script>
function entrar(){
    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;

    if(usuario === "admin" && senha === "1234"){
        document.getElementById("login").style.display = "none";
        document.getElementById("home").style.display = "block";
    } else {
        document.getElementById("mensagem").innerHTML =
        "Usuário ou senha incorretos!";
    }
}

function sair(){
    document.getElementById("home").style.display = "none";
    document.getElementById("login").style.display = "flex";

    document.getElementById("usuario").value = "";
    document.getElementById("senha").value = "";
    document.getElementById("mensagem").innerHTML = "";
}
</script>

</body>
</html>
